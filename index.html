<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Thumbnail cho chia sẻ mạng xã hội -->
<meta property="og:image" content="https://img.upanh.tv/2025/05/03/IMG_6752.png">
<meta property="og:title" content="Tạo Mã QR Chuyển Khoản">
<meta property="og:description" content="Tạo mã QR chuyển khoản ngân hàng nhanh chóng và tiện lợi.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://your-website-link.com"> <!-- Đổi thành link thực tế -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://img.upanh.tv/2025/05/03/IMG_6752.png">
  <title>Tạo Mã QR Chuyển Khoản</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tạo Mã QR Thanh Toán</h1>
    <form id="qrForm">
      <input type="text" id="accountName" placeholder="Tên người nhận" required>
      <input type="text" id="accountNo" placeholder="Số tài khoản" required>

      <div class="custom-select" id="bankSelect">
        <div class="select-selected">Chọn ngân hàng</div>
        <div class="select-items"></div>
      </div>

      <input type="text" id="amount" placeholder="Số tiền (VNĐ)">
      <input type="text" id="description" placeholder="Nội dung chuyển khoản">
      <button type="submit">Tạo QR</button>
    </form>

    <div id="qrCode"></div>
    <div id="qrActions" style="display:none; gap: 10px; margin-top: 15px; justify-content: center;">
      <button id="downloadBtn">Tải về ảnh QR</button>
      <button id="copyBtn">Sao chép liên kết</button>
    </div>
  </div>

  <div id="toast" class="toast">Chào mừng bạn đến với trang tạo mã QR thanh toán!</div>

  <script src="script.js"></script>
</body>
</html>
